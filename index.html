<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6e69"><meta name="description" content="Registro de entrenamiento de 12 semanas"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Entrenamiento 12 semanas</title><style>
:root{--p:#0b6e69;--bg:#f4f7f7;--card:#fff;--txt:#172323;--muted:#667474;--line:#dbe4e4;--ok:#157a55;--warn:#a85b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);padding-bottom:78px}.top{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-top));box-shadow:0 2px 8px #0002}.top h1{font-size:20px;margin:0}.top small{opacity:.85}.wrap{max-width:720px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 8px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px}.tabs button.active{background:var(--p);color:#fff;border-color:var(--p)}h2{font-size:18px;margin:5px 0 10px}h3{font-size:16px;margin:0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-size:15px}.field textarea{min-height:70px;resize:vertical}.exercise{border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0}.exercise.done{border-color:#9ed7c1;background:#f4fbf7}.check{width:22px;height:22px;accent-color:var(--ok)}.btn{border:0;border-radius:10px;padding:10px 12px;background:var(--p);color:#fff;font-weight:600}.btn.secondary{background:#e8eeee;color:var(--txt)}.btn.danger{background:#a33;color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:6}.bottom button{background:none;border:0;color:var(--muted);font-size:12px}.bottom button.active{color:var(--p);font-weight:700}.pill{padding:4px 8px;border-radius:999px;background:#edf4f3;font-size:12px}.notice{background:#fff7e8;border:1px solid #f0d29c;color:#704600}.dangerbox{background:#fff0f0;border:1px solid #e0b4b4}.bar{height:10px;background:#e6eeee;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--p)}
</style></head><body><header class="top"><h1>Entrenamiento · 12 semanas</h1><small>Registro móvil de fuerza + cardio</small></header><main class="wrap" id="app"></main><nav class="bottom"><button id="navPlan" onclick="show('plan')">🏋️<br>Plan</button><button id="navLog" onclick="show('registro')">☑️<br>Registro</button><button id="navProg" onclick="show('progreso')">📊<br>Progreso</button><button id="navInfo" onclick="show('info')">ℹ️<br>Guía</button></nav><script>
const exercises=[['Prensa de piernas','Piernas'],['Curl femoral','Piernas'],['Extensión de piernas','Piernas'],['Remo','Espalda'],['Jalón al pecho','Espalda'],['Press de pecho','Pecho']];
const days=['Lunes','Miércoles','Viernes'];
const plan=w=>({sets:w<=4?2:3,reps:w<=8?'12–15':'10–12',cardio:w<=2?20:w<=4?20+(w-2)*2.5:w<=8?25+(w-5)*2.5:30+(w-9)*3.33});
let state=JSON.parse(localStorage.getItem('entreno12')||'null')||{week:1,day:0,logs:{}};
function key(w,d,e){return `w${w}d${d}e${e}`}; function save(){localStorage.setItem('entreno12',JSON.stringify(state))}
function show(page){document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));document.getElementById('nav'+({plan:'Plan',registro:'Log',progreso:'Prog',info:'Info'}[page])).classList.add('active'); if(page==='plan')renderPlan();if(page==='registro')renderLog();if(page==='progreso')renderProg();if(page==='info')renderInfo()}
function renderPlan(){let p=plan(state.week);document.getElementById('app').innerHTML=`<div class="tabs">${Array.from({length:12},(_,i)=>`<button class="${state.week===i+1?'active':''}" onclick="state.week=${i+1};save();renderPlan()">S${i+1}</button>`).join('')}</div><div class="card"><div class="row between"><div><h2>Semana ${state.week}</h2><div class="muted">${p.sets} series · ${p.reps} repeticiones · cardio ${Math.round(p.cardio)} min</div></div><span class="pill">3 sesiones</span></div></div><div class="card"><h2>Sesiones</h2>${days.map((d,di)=>`<div class="exercise"><div class="row between"><div><h3>${d}</h3><div class="muted">Fuerza + cardio</div></div><button class="btn" onclick="state.day=${di};show('registro')">Registrar</button></div></div>`).join('')}</div><div class="card notice"><b>Control de intensidad</b><br><span class="muted">No trabajar al fallo. Mantener respiración continua y respetar el límite de frecuencia cardíaca indicado en tu plan médico: 142 ppm.</span></div>`}
function renderLog(){let w=state.week,d=state.day,p=plan(w);document.getElementById('app').innerHTML=`<div class="card"><div class="row between"><button class="btn secondary" onclick="state.day=(state.day+2)%3;renderLog()">←</button><div style="text-align:center"><h2>Semana ${w} · ${days[d]}</h2><div class="muted">${p.sets} × ${p.reps}</div></div><button class="btn secondary" onclick="state.day=(state.day+1)%3;renderLog()">→</button></div></div>${exercises.map((ex,i)=>{let k=key(w,d,i),l=state.logs[k]||{};return `<div class="exercise ${l.done?'done':''}"><div class="row"><input class="check" type="checkbox" ${l.done?'checked':''} onchange="upd('${k}','done',this.checked)"><div><h3>${ex[0]}</h3><div class="muted">${ex[1]}</div></div></div><div class="grid" style="margin-top:10px"><div class="field"><label>Peso (kg)</label><input inputmode="decimal" value="${l.kg||''}" onchange="upd('${k}','kg',this.value)"></div><div class="field"><label>Repeticiones</label><input inputmode="numeric" value="${l.reps||''}" onchange="upd('${k}','reps',this.value)"></div><div class="field"><label>Series completadas</label><input inputmode="numeric" value="${l.sets||''}" onchange="upd('${k}','sets',this.value)"></div><div class="field"><label>PPM máxima</label><input inputmode="numeric" value="${l.ppm||''}" onchange="upd('${k}','ppm',this.value)"></div><div class="field"><label>RPE (0–10)</label><input inputmode="numeric" value="${l.rpe||''}" onchange="upd('${k}','rpe',this.value)"></div></div></div>`}).join('')}<div class="card"><div class="field"><label>Observaciones de la sesión</label><textarea onchange="state.logs[${JSON.stringify(`w${w}d${d}notes`)}]=this.value;save()">${state.logs[`w${w}d${d}notes`]||''}</textarea></div></div><button class="btn" style="width:100%" onclick="state.week=Math.min(12,state.week+1);save();renderPlan()">Ir a semana siguiente</button>`}
function upd(k,f,v){state.logs[k]=state.logs[k]||{};state.logs[k][f]=v;save()}
function renderProg(){let completed=0,total=36;for(let w=1;w<=12;w++)for(let d=0;d<3;d++)if(state.logs[`w${w}d${d}e0`]?.done)completed++;let pct=Math.round(completed/total*100);document.getElementById('app').innerHTML=`<div class="card"><h2>Progreso de 12 semanas</h2><div class="row between"><b>${completed} / ${total} sesiones</b><b>${pct}%</b></div><div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div></div>${Array.from({length:12},(_,i)=>{let c=0;for(let d=0;d<3;d++)if(state.logs[`w${i+1}d${d}e0`]?.done)c++;return `<div class="card"><div class="row between"><b>Semana ${i+1}</b><span class="pill">${c}/3</span></div><div class="bar" style="margin-top:8px"><i style="width:${c/3*100}%"></i></div></div>`}).join('')}<div class="card"><button class="btn danger" onclick="if(confirm('¿Borrar todos los registros?')){state={week:1,day:0,logs:{}};save();renderProg()}">Borrar registros</button></div>`}
function renderInfo(){document.getElementById('app').innerHTML=`<div class="card"><h2>Cómo usar la app</h2><p>1. Elige una semana en <b>Plan</b>.</p><p>2. Pulsa <b>Registrar</b> en la sesión correspondiente.</p><p>3. Introduce peso, repeticiones, series, PPM y RPE.</p><p>4. Marca cada ejercicio al terminar.</p><p>Los datos se guardan automáticamente en este dispositivo.</p></div><div class="card notice"><b>Recordatorio</b><p>Este registro no sustituye las indicaciones de tu equipo médico. No trabajes al fallo y mantén respiración continua. Respeta el límite de 142 ppm que tienes indicado.</p></div><div class="card"><h2>Progresión</h2><p>Semanas 1–2: 2×12–15 · cardio 20 min.</p><p>Semanas 3–4: 2×12–15 · cardio 20–25 min.</p><p>Semanas 5–8: 3×12–15 · cardio 25–30 min.</p><p>Semanas 9–12: 3×10–12 · cardio 30–40 min.</p></div>`}
show('plan');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
