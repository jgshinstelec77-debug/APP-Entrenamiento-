<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Mi entrenamiento cardíaco</title>
</head>
<body>
<header><h1>Mi entrenamiento cardíaco</h1><p>12 semanas · 3 días/semana</p></header>
<main>
<section id="guided" class="screen">
  <div class="card">
    <label>Semana <select id="week"></select></label>
    <label>Día <select id="day"><option>1</option><option>2</option><option>3</option></select></label>
  </div>
  <div id="workout"></div>
</section>
<section id="save" class="screen hidden">
  <div class="card"><h2>Guardar sesión</h2>
    <p>Los datos se guardan en este dispositivo.</p>
    <button id="export">Exportar copia de seguridad</button>
    <label class="importLabel">Importar copia de seguridad<input id="import" type="file" accept=".json"></label>
    <button id="clear" class="danger">Borrar todos los registros</button>
  </div>
  <div id="summary"></div>
</section>
</main>
<nav><button id="navSave">Guardar sesión</button><button id="navGuided" class="active">Entrenamiento guiado</button></nav>
<script src="app.js"></script>
</body>
</html>
